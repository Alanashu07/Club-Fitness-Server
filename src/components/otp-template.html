<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#0A0A0A;font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0"
               style="background:#222222;border:1px solid #333333;border-radius:18px;padding:40px;">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="{{logo_url}}" alt="ClubFitness" height="40" />
            </td>
          </tr>
          <tr>
            <td align="center">
              <h1 style="font-size:22px;font-weight:700;letter-spacing:0.5px;color:#FFFFFF;margin:0 0 8px;">
                Hi {{name}},
              </h1>
              <p style="font-size:14px;color:#B0B0B0;margin:0 0 28px;line-height:1.5;">
                Use the code below to verify your email and continue signing in.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <div style="display:inline-block;padding:16px 28px;border-radius:14px;background:#1A1A1A;
                          border:1px solid #C41E2D;font-size:28px;font-weight:800;letter-spacing:8px;color:#FFFFFF;">
                {{otp}}
              </div>
            </td>
          </tr>
          <tr>
            <td align="center">
              <p style="font-size:13px;color:#B0B0B0;margin:0;line-height:1.5;">
                This code expires in {{expiry}} minutes.<br/>
                If you didn't request this, you can ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding-top:32px;border-top:1px solid #333333;margin-top:24px;">
              <p style="font-size:12px;color:#B0B0B0;text-align:center;margin:16px 0 0;">
                &copy; {{year}} ClubFitness. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
